name: la_vogue_vista
description: La Vogue Vista - AI-powered virtual try-on makeup application with personalized
  beauty assistant.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.7.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.4
  camera: ^0.10.5+5
  image: ^4.1.3
  cached_network_image: ^3.3.1
  # google_mlkit_face_detection: ^0.13.0  # iOS incompatible with Firebase - using native renderer
  # google_mlkit_face_mesh_detection: ^0.4.1  # iOS incompatible with Firebase - using native renderer
  # google_mlkit_commons: ^0.11.0  # iOS incompatible with Firebase - using native renderer
  google_fonts: ^6.1.0
  flutter_shaders: ^0.1.3
  tflite_flutter: ^0.12.1

  google_generative_ai: ^0.4.7
  
  http: ^1.1.0
  dio: ^5.3.2
  provider: ^6.1.1
  vector_math: ^2.1.4
  ffi: 2.1.0
  flutter_staggered_grid_view: ^0.7.0
  path_provider: ^2.1.1
  path: ^1.8.3
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5
  firebase_analytics: ^12.1.0
  firebase_crashlytics: ^5.0.6
  firebase_messaging: ^16.1.0
  google_sign_in: ^6.2.2
  camera_android: ^0.10.10+6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
