name: la_vogue_vista
description: La Vogue Vista - AI-powered virtual try-on makeup application with personalized
  beauty assistant.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.7.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.4
  camera: ^0.10.5+5
  image: ^4.1.3
  cached_network_image: ^3.3.1
  # google_mlkit_face_detection: ^0.13.0  # iOS incompatible with Firebase - using native renderer
  # google_mlkit_face_mesh_detection: ^0.4.1  # iOS incompatible with Firebase - using native renderer
  # google_mlkit_commons: ^0.11.0  # iOS incompatible with Firebase - using native renderer
  google_fonts: ^6.1.0
  flutter_shaders: ^0.1.3
  tflite_flutter: ^0.12.1

  google_generative_ai: ^0.4.7
  
  http: ^1.1.0
  flutter_dotenv: ^5.2.1
  dio: ^5.3.2
  provider: ^6.1.1
  vector_math: ^2.1.4
  ffi: 2.1.0
  flutter_staggered_grid_view: ^0.7.0
  path_provider: ^2.1.1
  path: ^1.8.3
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5
  firebase_analytics: ^12.1.0
  firebase_crashlytics: ^5.0.6
  firebase_messaging: ^16.1.0
  google_sign_in: ^6.2.2
  camera_android: ^0.10.10+6
  gal: ^2.3.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# Regenerate: dart run flutter_launcher_icons
# Master for home-screen icons: tight crop + centered on 1024² (see assets/app_icon.png).
flutter_launcher_icons:
  image_path: assets/app_icon.png
  ios: true
  android: true
  remove_alpha_ios: true

# Regenerate: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFF8F8"
  image: assets/logo.png
  android_12:
    image: assets/logo.png
    color: "#FFF8F8"
  ios: true
  android: true
  web: false

flutter:
  shaders:
  - assets/shaders/lipstick.frag
  uses-material-design: true
  assets:
  - .env
  - assets/env/local_keys.env
  - assets/logo.png
  - assets/discover/discover_live_makeup_hair.png
  - assets/discover/discover_ai_beauty.png
  - assets/discover/discover_hair_style.png
  # MediaPipe + live try-on models (used by native renderer)
  - assets/models/face_landmarker.task
  - assets/models/hand_landmarker.task
  - assets/models/hair_segmenter.tflite
  - assets/models/hair_type_classifier.tflite
  - assets/models/hair_type_classifier_labels.json
  - assets/models/hair_color_classifier.tflite
  - assets/models/hair_color_classifier_labels.json
  - assets/models/skin_tone_classifier.tflite
  - assets/models/skin_tone_classifier_labels.json
  - assets/models/undertone_classifier.tflite
  - assets/models/undertone_classifier_labels.json
  - assets/models/makeup_detector.tflite
  - assets/models/makeup_detector_labels.json
  - assets/icons/google.png
  - assets/icons/ai.png
  - assets/masks/lip_oval.png
  - assets/data/named_colors.json
  - assets/data/color_name_list.json
